[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rox-mecanum"
version = "0.1.0"
description = "DualSense input and mecanum-drive utilities for ROX robots"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ROX Matsue" }]
dependencies = []

[project.optional-dependencies]
pygame = ["pygame>=2.5"]
serial = ["pyserial>=3.5"]
hardware = ["pygame>=2.5", "pyserial>=3.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rox_mecanum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
